<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeLine — From first call to final invoice</title>
<meta name="description" content="TradeLine is a field-service CRM for the trades — requests, quotes, jobs, invoicing, payments and job costing in one place. Try the live demo.">
<meta property="og:title" content="TradeLine — Field Service CRM">
<meta property="og:description" content="From first call to final invoice. Try the live demo — no signup needed.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232f6fa8'/><text x='50' y='72' font-size='62' font-weight='bold' font-family='Arial' fill='white' text-anchor='middle'>T</text></svg>">
<style>
  :root{
    --green:#2f6fa8; --green-d:#25588a; --green-l:#e8f1f9;
    --ink:#1f2733; --muted:#6b7683; --line:#e4e8ec; --bg:#f5f7f8;
    --amber:#b8860b; --amber-bg:#fdf3d9; --blue:#2563eb; --blue-bg:#e8effd;
    --red:#c0392b; --red-bg:#fdecea; --slate:#546074; --slate-bg:#eef1f4;
    --purple:#7c3aed; --purple-bg:#f1eafd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
  a{color:inherit;text-decoration:none}
  .app{display:flex;min-height:100vh}
  .side{width:228px;background:#0f1e2e;color:#cfdeed;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
  .brand{padding:16px 18px 10px;font-weight:800;font-size:16px;color:#fff;display:flex;align-items:center;gap:9px}
  .brand .dot{width:22px;height:22px;border-radius:6px;background:var(--green);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
  .brand small{display:block;font-weight:500;font-size:10px;color:#7f9ab5;letter-spacing:.5px;text-transform:uppercase;margin-top:1px}
  .nav{padding:4px 10px 8px;flex:1}
  .nav a{display:flex;align-items:center;gap:10px;padding:7px 11px;border-radius:8px;color:#b9cbde;font-weight:500;margin-bottom:1px;cursor:pointer;font-size:13.5px}
  .nav a:hover{background:#1b3247;color:#fff}
  .nav a.active{background:var(--green);color:#fff}
  .nav a .ic{width:16px;text-align:center;font-size:14px}
  .nav a .lock{margin-left:auto;font-size:11px;opacity:.75}
  .nav .grouplbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;color:#5d7a97;padding:11px 11px 4px;font-weight:700}
  .side .foot{padding:10px 16px;border-top:1px solid #1c3349;font-size:11px;color:#6f8aa5}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{background:#fff;border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;gap:12px}
  .top h1{font-size:18px;font-weight:700}
  .top .sub{font-size:12px;color:var(--muted);margin-top:1px}
  .top .right{display:flex;align-items:center;gap:10px}
  .btn{background:var(--green);color:#fff;border:none;padding:9px 15px;border-radius:8px;font-weight:600;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{background:var(--green-d)}
  .btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.sec:hover{background:#f3f5f6}
  .btn.sm{padding:6px 11px;font-size:12.5px}
  .btn.ghost{background:transparent;color:var(--green);padding:6px 8px}
  .btn.ghost:hover{background:var(--green-l)}
  .btn.danger{background:#fff;color:var(--red);border:1px solid #f0cdc8}
  .btn.purple{background:var(--purple)}
  .btn.purple:hover{background:#6a2fd0}
  .content{padding:22px 26px;max-width:1180px}
  .grid{display:grid;gap:16px}
  .cards4{grid-template-columns:repeat(4,1fr)}
  .cards3{grid-template-columns:repeat(3,1fr)}
  .cards2{grid-template-columns:repeat(2,1fr)}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
  .stat .lbl{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .stat .val{font-size:26px;font-weight:800;margin-top:6px}
  .stat .meta{font-size:12px;color:var(--muted);margin-top:3px}
  .stat .ic{float:right;width:36px;height:36px;border-radius:10px;background:var(--green-l);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:17px}
  .sec-title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--slate);margin:24px 0 12px}
  .sec-title:first-child{margin-top:0}
  table{width:100%;border-collapse:collapse;background:#fff}
  .tablewrap{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:10px 15px;background:#fafbfb;border-bottom:1px solid var(--line);font-weight:700}
  td{padding:11px 15px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr.click{cursor:pointer}
  tbody tr.click:hover{background:#fafcfb}
  .strong{font-weight:600}
  .tiny{font-size:12px;color:var(--muted)}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
  .p-green{background:#d9efec;color:#0f766e}
  .p-amber{background:var(--amber-bg);color:var(--amber)}
  .p-blue{background:var(--blue-bg);color:var(--blue)}
  .p-red{background:var(--red-bg);color:var(--red)}
  .p-slate{background:var(--slate-bg);color:var(--slate)}
  .p-purple{background:var(--purple-bg);color:var(--purple)}
  .overlay{position:fixed;inset:0;background:rgba(13,25,38,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow:auto}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .15s ease}
  .modal.wide{max-width:820px}
  @keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
  .mhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .mhead h3{font-size:17px}
  .mhead .x{cursor:pointer;color:var(--muted);font-size:22px;line-height:1;background:none;border:none}
  .mbody{padding:22px}
  .mfoot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#fafbfb;border-radius:0 0 14px 14px}
  label.fld{display:block;margin-bottom:14px}
  label.fld span{display:block;font-size:12.5px;font-weight:600;color:var(--slate);margin-bottom:5px}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-l)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .li-row{display:grid;grid-template-columns:2.4fr .7fr 1fr auto;gap:9px;align-items:center;margin-bottom:8px}
  .li-row input{padding:8px 10px}
  .subtot{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px}
  .subtot.big{font-size:17px;font-weight:800;border-top:2px solid var(--ink);margin-top:8px;padding-top:12px}
  .back{color:var(--green);font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;margin-bottom:14px}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  .kv{display:flex;gap:26px;flex-wrap:wrap;margin:14px 0}
  .kv div .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
  .kv div .v{font-size:14px;font-weight:600;margin-top:3px}
  .flow{display:flex;margin:16px 0 22px;flex-wrap:wrap}
  .flow .step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
  .flow .step .n{width:24px;height:24px;border-radius:50%;background:#eef1f4;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .flow .step.done .n{background:var(--green);color:#fff}
  .flow .step.done{color:var(--green-d)}
  .flow .arw{width:34px;height:2px;background:var(--line);margin:0 6px;align-self:center}
  .chk{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
  .chk input{width:auto}
  .chk.done label{text-decoration:line-through;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:36px 20px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-weight:600;font-size:13.5px;z-index:200;opacity:0;transition:.25s;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  .toast.show{opacity:1;bottom:34px}
  .note{background:var(--green-l);border:1px solid #c3d8ec;color:var(--green-d);padding:11px 14px;border-radius:9px;font-size:12.5px;margin-bottom:16px}
  .warn{background:var(--amber-bg);border:1px solid #eeda9e;color:var(--amber);padding:11px 14px;border-radius:9px;font-size:12.5px;margin-bottom:16px}
  .hintbar{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:12px 16px;font-size:12.5px;color:var(--muted);margin-bottom:20px}
  .hintbar b{color:var(--ink)}
  /* paywall */
  .paywall{max-width:560px;margin:40px auto;text-align:center}
  .paywall .lockic{font-size:38px;margin-bottom:10px}
  .paywall h2{font-size:21px;margin-bottom:8px}
  .paywall p{color:var(--muted);margin-bottom:18px}
  /* plans */
  .plans{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:stretch}
  .plan{background:#fff;border:2px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;position:relative}
  .plan.cur{border-color:var(--green)}
  .plan .cur-tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%)}
  .plan h4{font-size:16px}
  .plan .pr{font-size:25px;font-weight:800;margin:8px 0 2px}
  .plan .pr small{font-size:12px;color:var(--muted);font-weight:500}
  .plan ul{list-style:none;margin:12px 0;flex:1}
  .plan li{font-size:12.5px;padding:4px 0;color:var(--slate)}
  .plan li::before{content:'✓ ';color:var(--green);font-weight:700}
  /* integrations */
  .ints{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .int{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
  .int .ihead{display:flex;align-items:center;gap:10px}
  .int .logo{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0}
  .int h4{font-size:14.5px}
  .int .desc{font-size:12.5px;color:var(--muted);flex:1}
  .int .fx{font-size:12px;color:var(--green-d);background:var(--green-l);border-radius:7px;padding:7px 10px}
  /* kanban */
  .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
  .kcol{background:#eef1f2;border-radius:12px;padding:12px}
  .kcol h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--slate);margin-bottom:10px;display:flex;justify-content:space-between}
  .kcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:9px}
  .kcard .amt{font-weight:800;margin-top:4px}
  /* toggle */
  .tgl{position:relative;width:40px;height:22px;background:#cfd6dc;border-radius:20px;cursor:pointer;transition:.15s;flex-shrink:0}
  .tgl.on{background:var(--green)}
  .tgl::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
  .tgl.on::after{left:20px}
  .tglrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .tglrow:last-child{border-bottom:none}
  /* client hub */
  .hub{max-width:640px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .hub .hh{background:var(--ink);color:#fff;padding:20px 24px}
  .hub .hh h3{font-size:18px}
  .hub .hh .tiny{color:#aeb8c2}
  .hub .hb{padding:20px 24px}
  .logrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .logrow .when{color:var(--muted);white-space:nowrap;width:86px;flex-shrink:0}
  .logrow:last-child{border-bottom:none}
  .chatline{display:flex;gap:8px;margin-bottom:8px}
  .bub{padding:8px 12px;border-radius:12px;max-width:78%;font-size:12.5px}
  .bub.caller{background:var(--slate-bg)}
  .bub.ai{background:var(--purple-bg);margin-left:auto}
  /* launcher */
  #launcher{position:fixed;inset:0;background:#0f1e2e;z-index:300;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:48px 20px}
  .launch{max-width:780px;width:100%}
  .launch .lhead{text-align:center;color:#fff;margin-bottom:28px}
  .launch .lhead h1{font-size:26px;font-weight:800}
  .launch .lhead p{color:#8fa9c4;margin-top:6px;font-size:14px}
  .bizgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:22px}
  .bizcard{background:#fff;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
  .bizcard .bdot{width:38px;height:38px;border-radius:10px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
  .bizcard h3{font-size:16px}
  .bizcard .actions{display:flex;gap:8px;margin-top:8px}
  .launchform{background:#fff;border-radius:14px;padding:22px}
  .launchform h3{margin-bottom:14px;font-size:16px}
  .seedopt{display:flex;gap:12px;margin:4px 0 16px}
  .seedopt label{flex:1;border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;font-size:12.5px}
  .seedopt label.sel{border-color:var(--green);background:var(--green-l)}
  .seedopt label b{display:block;font-size:13.5px;margin-bottom:3px}
  .seedopt input{display:none}

  /* ---- mobile ---- */
  .menubtn{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:17px;cursor:pointer;color:var(--ink);flex-shrink:0}
  .scrim{position:fixed;inset:0;background:rgba(13,25,38,.45);z-index:240;display:none}
  @media(max-width:900px){
    .side{position:fixed;left:0;top:0;bottom:0;z-index:250;transform:translateX(-100%);transition:transform .18s ease;height:100%}
    .side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.45)}
    .menubtn{display:inline-flex}
    .top{padding:10px 14px}
    .content{padding:16px 14px}
    .cards4,.cards3{grid-template-columns:1fr 1fr}
    .cards2,.kanban,.ints,.plans{grid-template-columns:1fr}
    .row2{grid-template-columns:1fr}
    .kv{gap:14px 20px}
    .li-row{grid-template-columns:1.5fr .55fr .8fr auto;gap:6px}
    .flow .arw{width:14px;margin:0 3px}
    .bizgrid{grid-template-columns:1fr}
    .seedopt{flex-direction:column}
    th,td{padding:9px 10px}
  }
  @media(max-width:480px){
    .cards4,.cards3{grid-template-columns:1fr}
    .top h1{font-size:16px}
  }

  /* ---- print (quotes & invoices → PDF) ---- */
  @media print{
    .side,.top,.menubtn,.scrim,.back,.hintbar,.toast,button,.overlay{display:none!important}
    body{background:#fff}
    .content{padding:0;max-width:none}
    .card,.tablewrap{border-color:#ccc;break-inside:avoid}
    .note,.warn{border-color:#ccc;background:#fff}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="dot" id="bizDot">T</span><div><span id="bizName">TradeLine</span> <span class="pill p-purple" style="font-size:9px;padding:2px 7px;vertical-align:2px">PRO</span><small id="bizTrade">Field Service CRM</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><a href="index.html" style="color:#7db4e0;text-decoration:none;font-weight:600">← TradeLine home</a><br><span style="opacity:.8">Demo · data saves in this browser</span><br><a style="color:#9fb8d1;text-decoration:underline;cursor:pointer" onclick="showLauncher()">⇄ Switch business</a> · <a style="color:#9fb8d1;text-decoration:underline;cursor:pointer" onclick="resetDemo()">Reset this business</a></div>
  </aside>
  <div class="main">
    <div class="top">
      <div style="display:flex;align-items:center;gap:11px;min-width:0">
        <button class="menubtn" onclick="toggleMenu()" aria-label="Menu">☰</button>
        <div style="min-width:0"><h1 id="pageTitle">Dashboard</h1><div class="sub" id="pageSub"></div></div>
      </div>
      <div class="right"><span id="planBadge"></span><span id="topAction"></span></div>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<div class="scrim" id="scrim" onclick="toggleMenu(false)"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div id="launcher"></div>

<script>
/* ============================ CORE HELPERS ============================ */
let UID = 1000;
const uid = p => (p||'') + (++UID);
const money = n => ((n||0)<0?'−':'') + '$' + Math.abs(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const iso = d => d.toISOString().slice(0,10);
const today = iso(new Date());
const daysFromNow = n => iso(new Date(Date.now()+n*864e5));
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dfmt = d => { if(!d) return '—'; const [y,m,day]=d.split('-'); return `${MONTHS[+m-1]} ${+day}, ${y}`; };
const shortDate = d => { const [y,m,day]=d.split('-'); return `${MONTHS[+m-1]} ${+day}`; };
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ============================ PLANS & FEATURES ============================ */
const PLANS = [
  {key:'core',    name:'Core',    mo:49,  users:1,  feats:['Quotes, jobs & invoicing','Online payments','Client manager (CRM)','Online requests','Reporting basics']},
  {key:'connect', name:'Connect', mo:139, users:5,  feats:['Everything in Core','QuickBooks Online sync','Time & expense tracking','Automated reminders','Job checklists']},
  {key:'grow',    name:'Grow',    mo:199, users:10, feats:['Everything in Connect','Job costing & reports','Custom automations','Two-way SMS','Quote add-ons & upsells']},
  {key:'plus',    name:'Plus',    mo:499, users:15, feats:['Everything in Grow','Sales Pipeline included','Marketing Suite included','AI Receptionist included','Premium support']},
];
const RANK = {core:0, connect:1, grow:2, plus:3};
const ADDONS = {ai:{name:'AI Receptionist',mo:29}, marketing:{name:'Marketing Suite',mo:79}, pipeline:{name:'Sales Pipeline',mo:49}};

const FEAT = {
  timesheets:{name:'Timesheets & time tracking', min:'connect', desc:'Track crew hours against each job, feeding labor cost into job costing.'},
  expenses:{name:'Expense tracking', min:'connect', desc:'Log material and supply spend per job from the field.'},
  reports:{name:'Job costing & reports', min:'grow', desc:'See quoted vs invoiced vs actual labor + materials, per job, with margins.'},
  automations:{name:'Custom automations', min:'grow', desc:'Auto quote follow-ups, invoice reminders, review requests and more.'},
  pipeline:{name:'Sales Pipeline', min:'plus', addon:'pipeline', desc:'Kanban view of every lead from request → quoted → won.'},
  marketing:{name:'Marketing Suite', min:'plus', addon:'marketing', desc:'Review requests, email campaigns and referral tracking.'},
  ai:{name:'AI Receptionist', min:'plus', addon:'ai', desc:'Answers missed & after-hours calls, books requests for you.'},
};
function has(f){
  const m = FEAT[f]; if(!m) return true;
  if (RANK[state.plan] >= RANK[m.min]) return true;
  if (m.addon && state.addons[m.addon]) return true;
  return false;
}

/* ============================ INTEGRATIONS CATALOG ============================ */
const INTS = [
  {key:'qbo', name:'QuickBooks Online', cat:'Accounting', color:'#2ca01c', min:'connect', desc:'Two-way sync of clients, invoices, payments & payouts to your books.',
    fx:()=>`✓ Synced ${state.invoices.length} invoices & ${state.payments.length} payments to QBO`},
  {key:'zapier', name:'Zapier', cat:'Automation', color:'#ff4a00', desc:'Connect 6,000+ apps — fire zaps on new requests, won quotes, paid invoices.',
    fx:()=>'✓ 2 zaps active: "Won quote → Slack" · "Paid invoice → Google Sheets"'},

/* derived helpers */
const client = id => state.clients.find(c=>c.id===id) || {name:'—',contact:'',address:'',phone:'',email:''};
const quoteTotal = q => q.items.reduce((s,i)=>s+i.q*i.p,0);
const invTotal = inv => inv.items.reduce((s,i)=>s+i.q*i.p,0);
const invPaid = inv => state.payments.filter(p=>p.invoiceId===inv.id).reduce((s,p)=>s+p.amount,0);
const invBalance = inv => invTotal(inv)-invPaid(inv);
const jobLabor = jid => state.timesheets.filter(t=>t.jobId===jid).reduce((s,t)=>s+t.hours*t.rate,0);
const jobExp = jid => state.expenses.filter(e=>e.jobId===jid).reduce((s,e)=>s+e.amount,0);
const pill = (txt,cls) => `<span class="pill ${cls}">${txt}</span>`;
const statusPill = s => ({
  draft:pill('Draft','p-slate'), sent:pill('Sent','p-blue'), approved:pill('Approved','p-green'),
  scheduled:pill('Scheduled','p-blue'), in_progress:pill('In progress','p-amber'), complete:pill('Complete','p-green'),
  paid:pill('Paid','p-green'), overdue:pill('Overdue','p-red'), new:pill('New','p-amber'), converted:pill('Converted','p-green')
}[s] || pill(s,'p-slate'));

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}

function toggleMenu(force){
  const side=document.querySelector('.side');

  document.getElementById('scrim').style.display = open ? 'block' : 'none';
}
function go(view,arg){current=view;
  toggleMenu(false);
  const [t,s]=titles[view]||[view,''];
  document.getElementById('pageTitle').textContent=t; document.getElementById('pageSub').textContent=s;
  renderNav();
  const gated = NAVFEAT[view];
  document.getElementById('topAction').innerHTML = (gated&&!has(gated)) ? '' : (topActions[view]||'');
  if (gated && !has(gated)) paywall(gated); else views[view](arg);

}

  list.map(q=>`<tr class="click" onclick="quoteDetail('${q.id}')"><td><div class="strong">${esc(q.title)}</div><div class="tiny">${q.id.toUpperCase()}</div></td><td>${esc(client(q.clientId).name)}</td><td class="tiny">${dfmt(q.date)}</td><td class="strong">${money(quoteTotal(q))}</td><td>${statusPill(q.status)}</td></tr>`).join('')
}</tbody></table></div>`;}
views.quotes=function(){el().innerHTML=state.quotes.length?tableQuotes(state.quotes):'<div class="card empty">No quotes yet. Click “New quote”.</div>';};

function quoteDetail(id){const q=state.quotes.find(x=>x.id===id);const c=client(q.clientId);

  el().innerHTML=`<div class="back" onclick="go('quotes')">← All quotes</div>
  <div class="detail-head"><div><h2 style="font-size:22px">${esc(q.title)}</h2><div class="tiny">${q.id.toUpperCase()} · ${esc(c.name)} · ${dfmt(q.date)}</div></div><div>${statusPill(q.status)}</div></div>
  <div class="flow">${steps.map((s,i)=>`<div class="step ${i<=si?'done':''}"><span class="n">${i<=si?'✓':i+1}</span>${s.charAt(0).toUpperCase()+s.slice(1)}</div>${i<2?'<span class="arw"></span>':''}`).join('')}</div>
  <div class="card">
    <table><thead><tr><th>Line item</th><th style="text-align:right">Qty</th><th style="text-align:right">Rate</th><th style="text-align:right">Amount</th></tr></thead><tbody>
    ${q.items.map(i=>`<tr><td>${esc(i.d)}</td><td style="text-align:right">${i.q}</td><td style="text-align:right">${money(i.p)}</td><td style="text-align:right" class="strong">${money(i.q*i.p)}</td></tr>`).join('')}
    </tbody></table>
    <div style="max-width:280px;margin-left:auto;margin-top:14px"><div class="subtot big"><span>Total</span><span>${money(quoteTotal(q))}</span></div></div>
  </div>

    ${q.status==='sent'?`<button class="btn" onclick="setQuote('${id}','approved')">✓ Mark approved</button><button class="btn sec" onclick="setQuote('${id}','draft')">Back to draft</button>`:''}
    ${q.status==='approved'?`<button class="btn" onclick="newJob(null,'${id}')">▦ Convert to job →</button>`:''}

  ${q.status==='approved'?'<div class="note" style="margin-top:16px">✓ Approved. Next: <b>Convert to job</b> to schedule the work.</div>':''}`;
}
function setQuote(id,s){state.quotes.find(q=>q.id===id).status=s;
  if(s==='sent'&&has('automations')&&state.automations.find(a=>a.key==='a1').on)autolog('Follow-up scheduled for quote '+id.toUpperCase());
  toast('Quote → '+s);quoteDetail(id);}

views.pipeline=function(){
  const leads=state.requests.filter(r=>r.status==='new');

    ${col('Quoted',quoted,q=>`<div class="kcard" style="cursor:pointer" onclick="quoteDetail('${q.id}')"><div class="strong">${esc(client(q.clientId).name)}</div><div class="tiny">${esc(q.title)}</div><div class="amt">${money(quoteTotal(q))}</div><div style="margin-top:4px">${statusPill(q.status)}</div></div>`,quoted.reduce((s,q)=>s+quoteTotal(q),0))}
    ${col('Won',won,q=>`<div class="kcard" style="cursor:pointer" onclick="quoteDetail('${q.id}')"><div class="strong">${esc(client(q.clientId).name)}</div><div class="tiny">${esc(q.title)}</div><div class="amt" style="color:var(--green-d)">${money(quoteTotal(q))}</div></div>`,won.reduce((s,q)=>s+quoteTotal(q),0))}

/* ---- CLIENT HUB ---- */
views.hub=function(sel){

  <div style="max-width:640px;margin:0 auto 14px"><label class="fld"><span>Preview as client</span><select onchange="go('hub',this.value)">${state.clients.map(x=>`<option value="${x.id}" ${x.id===cid?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div>
  <div class="hub">
    <div class="hh"><h3>${esc(activeWs?activeWs.name:'Your Business')}</h3><div class="tiny">Client portal for ${esc(c.contact||c.name)}</div></div>
    <div class="hb">
      <div class="sec-title">Quotes waiting for your approval</div>
      ${qs.length?qs.map(q=>`<div class="card" style="margin-bottom:10px"><div class="detail-head"><div><div class="strong">${esc(q.title)}</div><div class="tiny">Quoted ${dfmt(q.date)}</div></div><div class="strong">${money(quoteTotal(q))}</div></div><button class="btn sm" onclick="hubApprove('${q.id}','${cid}')">✓ Approve quote</button></div>`).join(''):'<div class="tiny" style="margin-bottom:6px">Nothing waiting.</div>'}
      <div class="sec-title">Upcoming visits</div>
      ${js.length?js.map(j=>`<div class="chk"><span>▦</span><label><b>${dfmt(j.date)}</b> — ${esc(j.title)}</label></div>`).join(''):'<div class="tiny">No visits scheduled.</div>'}
      <div class="sec-title">Invoices due</div>

};
function hubApprove(qid,cid){setQuoteSilent(qid,'approved');toast('Client approved the quote ✓ — check your Quotes list');go('hub',cid);}
function setQuoteSilent(id,s){state.quotes.find(q=>q.id===id).status=s;}
function hubPay(iid,cid){const inv=state.invoices.find(i=>i.id===iid);
  state.payments.push({id:uid('p'),invoiceId:iid,amount:invBalance(inv),method:'Credit card (client hub)',date:today});
  inv.status='paid';toast('Client paid online 🎉 — see Payments');go('hub',cid);}

function tableJobs(list){return `<div class="tablewrap"><table><thead><tr><th>Job</th><th>Client</th><th>Date</th><th>Crew</th><th>Progress</th><th>Status</th></tr></thead><tbody>${
  list.map(j=>{const done=j.checklist.filter(c=>c.done).length;return `<tr class="click" onclick="jobDetail('${j.id}')"><td><div class="strong">${esc(j.title)}</div><div class="tiny">${j.id.toUpperCase()}</div></td><td>${esc(client(j.clientId).name)}</td><td class="tiny">${dfmt(j.date)}</td><td class="tiny">${esc(j.crew)}</td><td class="tiny">${done}/${j.checklist.length} tasks</td><td>${statusPill(j.status)}</td></tr>`;}).join('')
}</tbody></table></div>`;}
views.schedule=function(){
  const sorted=[...state.jobs].sort((a,b)=>a.date.localeCompare(b.date));
  el().innerHTML=`<div class="hintbar">🗓️ Jobs come from approved quotes (or direct). Open one to run the on-site <b>checklist</b>, then complete it to unlock invoicing.${state.integrations.gcal?' <b>· Syncing to Google Calendar ✓</b>':''}${state.integrations.fleetsharp?' <b>· Crew GPS live ✓</b>':''}</div>${sorted.length?tableJobs(sorted):'<div class="card empty">No jobs scheduled.</div>'}`;
};
function jobDetail(id){const j=state.jobs.find(x=>x.id===id);const c=client(j.clientId);
  const done=j.checklist.filter(x=>x.done).length,total=j.checklist.length;
  const steps=['scheduled','in_progress','complete'];const si=steps.indexOf(j.status);
  const inv=state.invoices.find(i=>i.jobId===id);
  const labor=jobLabor(id), exp=jobExp(id);
  el().innerHTML=`<div class="back" onclick="go('schedule')">← Schedule</div>
  <div class="detail-head"><div><h2 style="font-size:22px">${esc(j.title)}</h2><div class="tiny">${j.id.toUpperCase()} · ${esc(c.name)}</div></div><div>${statusPill(j.status)}</div></div>
  <div class="flow">${steps.map((s,i)=>`<div class="step ${i<=si?'done':''}"><span class="n">${i<=si?'✓':i+1}</span>${({scheduled:'Scheduled',in_progress:'In progress',complete:'Complete'})[s]}</div>${i<2?'<span class="arw"></span>':''}`).join('')}</div>
  <div class="kv">
    <div><div class="k">Scheduled date</div><div class="v">${dfmt(j.date)}</div></div>
    <div><div class="k">Crew</div><div class="v">${esc(j.crew)}</div></div>
    <div><div class="k">Site</div><div class="v">${esc(c.address)}</div></div>
    <div><div class="k">Source</div><div class="v">${j.quoteId?j.quoteId.toUpperCase()+' (quote)':'Direct'}</div></div>
    ${has('timesheets')?`<div><div class="k">Labor logged</div><div class="v">${money(labor)}</div></div>`:''}
    ${has('expenses')?`<div><div class="k">Expenses</div><div class="v">${money(exp)}</div></div>`:''}
  </div>
  ${state.integrations.companycam?'<div class="note">📷 CompanyCam photo feed attached to this job.</div>':''}
  <div class="grid cards2" style="align-items:start">
    <div class="card">
      <div class="strong" style="margin-bottom:6px">On-site checklist <span class="tiny">(${done}/${total})</span></div>
      ${j.checklist.map((ck,idx)=>`<div class="chk ${ck.done?'done':''}"><input type="checkbox" ${ck.done?'checked':''} onchange="toggleChk('${id}',${idx})" id="ck${idx}"><label for="ck${idx}">${esc(ck.t)}</label></div>`).join('')}
    </div>
    <div class="card">
      <div class="strong" style="margin-bottom:10px">Move this job along</div>
      ${j.status==='scheduled'?`<button class="btn" onclick="setJob('${id}','in_progress')">▶ Start job (crew on site)</button>`:''}
      ${j.status==='in_progress'?`<button class="btn" onclick="setJob('${id}','complete')">✓ Mark complete</button>`:''}
      ${j.status==='complete'&&!inv?`<div class="note">Work is done. Bill the client:</div><button class="btn" onclick="newInvoice(null,'${id}')">₿ Create invoice from job →</button>`:''}
      ${inv?`<div class="note">Invoiced: <b>${inv.id.toUpperCase()}</b> · ${statusPill(invBalance(inv)<=0?'paid':inv.status)}</div><button class="btn sec" onclick="invoiceDetail('${inv.id}')">View invoice</button>`:''}
      ${has('timesheets')?`<div style="margin-top:12px"><button class="btn sec sm" onclick="newTime('${id}')">⏱ Log crew time</button> <button class="btn sec sm" onclick="newExpense('${id}')">⌥ Add expense</button></div>`:''}
      <div style="margin-top:14px"><button class="btn danger sm" onclick="delItem('jobs','${id}')">Delete job</button></div>
    </div>
  </div>`;
}
function toggleChk(id,idx){const j=state.jobs.find(x=>x.id===id);j.checklist[idx].done=!j.checklist[idx].done;
  if(j.checklist.some(c=>c.done)&&j.status==='scheduled')j.status='in_progress';jobDetail(id);}
function setJob(id,s){state.jobs.find(j=>j.id===id).status=s;
  if(s==='complete'&&has('automations')&&state.automations.find(a=>a.key==='a4').on){autolog('Review request queued for '+client(state.jobs.find(j=>j.id===id).clientId).name);toast('Job complete — review request queued ⚙');}
  else toast('Job → '+s.replace('_',' '));
  jobDetail(id);}

views.reports=function(){
  const rows=state.jobs.map(j=>{
    const q=j.quoteId?state.quotes.find(x=>x.id===j.quoteId):null;

function newQuote(preClient,preTitle){if(needClients())return;draftItems=[{d:'',q:1,p:0}];
  openModal(`<div class="mhead"><h3>New quote</h3><button class="x" onclick="closeModal()">×</button></div>
  <div class="mbody">
    <div class="row2">
      <label class="fld"><span>Client</span><select id="q_client">${state.clients.map(c=>`<option value="${c.id}" ${c.id===preClient?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>

    <div style="max-width:240px;margin-left:auto;margin-top:8px"><div class="subtot big"><span>Total</span><span id="q_total">$0.00</span></div></div>
  </div>
  <div class="mfoot"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn sec" onclick="saveQuote('draft')">Save draft</button><button class="btn" onclick="saveQuote('sent')">Save &amp; send</button></div>`,true);
  renderItems();

function renderItems(){document.getElementById('q_items').innerHTML=draftItems.map((it,i)=>`
  <div class="li-row">
    <input placeholder="Description" value="${esc(it.d)}" oninput="upd(${i},'d',this.value)">
    <input type="number" min="0" step="any" placeholder="Qty" value="${it.q}" oninput="upd(${i},'q',this.value)">
    <input type="number" min="0" step="any" placeholder="Rate" value="${it.p}" oninput="upd(${i},'p',this.value)">
    <button class="btn sec sm" onclick="rmItem(${i})" ${draftItems.length<2?'disabled style=opacity:.4':''}>×</button>
  </div>`).join('');
  const tot=draftItems.reduce((s,i)=>s+(+i.q||0)*(+i.p||0),0);const t=document.getElementById('q_total');if(t)t.textContent=money(tot);}
function addItem(){draftItems.push({d:'',q:1,p:0});renderItems();}
function rmItem(i){draftItems.splice(i,1);renderItems();}
function upd(i,k,v){draftItems[i][k]=(k==='d')?v:(+v||0);if(k!=='d')renderItems();else{const tot=draftItems.reduce((s,x)=>s+(+x.q||0)*(+x.p||0),0);document.getElementById('q_total').textContent=money(tot);}}
function saveQuote(status){const title=document.getElementById('q_title').value.trim();if(!title){toast('Add a job title');return;}
  const items=draftItems.filter(i=>i.d.trim()).map(i=>({d:i.d,q:+i.q||0,p:+i.p||0}));if(!items.length){toast('Add at least one line item');return;}
  const q={id:uid('q'),clientId:document.getElementById('q_client').value,title,status,date:document.getElementById('q_date').value||today,items};
  state.quotes.push(q);
  if(status==='sent'&&has('automations')&&state.automations.find(a=>a.key==='a1').on)autolog('Follow-up scheduled for quote '+q.id.toUpperCase());
  closeModal();toast(status==='sent'?'Quote sent':'Draft saved');go('quotes');quoteDetail(q.id);}

function newJob(preClient,fromQuote){
  if(needClients())return;
  const q=fromQuote?state.quotes.find(x=>x.id===fromQuote):null;
  const selClient=q?q.clientId:(preClient||state.clients[0].id);
  openModal(`<div class="mhead"><h3>${q?'Convert quote to job':'Schedule a job'}</h3><button class="x" onclick="closeModal()">×</button></div>
  <div class="mbody">
    ${q?`<div class="note">Building a job from approved quote <b>${q.id.toUpperCase()}</b> — ${money(quoteTotal(q))}.</div>`:''}
    <div class="row2">
      <label class="fld"><span>Client</span><select id="j_client" ${q?'disabled':''}>${state.clients.map(c=>`<option value="${c.id}" ${c.id===selClient?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
      <label class="fld"><span>Date</span><input id="j_date" type="date" value="${today}"></label>
    </div>
    <label class="fld"><span>Job title</span><input id="j_title" value="${q?esc(q.title):''}" placeholder="What's the work?"></label>
    <label class="fld"><span>Assign crew</span><input id="j_crew" placeholder="e.g. Crew A — Luis, Marco"></label>
    <label class="fld"><span>Checklist (one task per line)</span><textarea id="j_chk" rows="4">${q?'Confirm site is ready\nStage materials\nMask & protect\nDo the work\nFinal walk-through':''}</textarea></label>
  </div>
  <div class="mfoot"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveJob('${fromQuote||''}')">Schedule job</button></div>`);
}
function saveJob(fromQuote){const title=document.getElementById('j_title').value.trim();if(!title){toast('Add a job title');return;}
  const chk=document.getElementById('j_chk').value.split('\n').map(t=>t.trim()).filter(Boolean).map(t=>({t,done:false}));
  const j={id:uid('j'),clientId:document.getElementById('j_client').value,quoteId:fromQuote||null,title,date:document.getElementById('j_date').value||today,crew:document.getElementById('j_crew').value||'Unassigned',status:'scheduled',checklist:chk.length?chk:[{t:'Complete the work',done:false}]};
  state.jobs.push(j);closeModal();toast('Job scheduled'+(state.integrations.gcal?' · synced to Google Calendar':''));go('schedule');jobDetail(j.id);}

function newInvoice(preClient,fromJob){
  if(needClients())return;
  const j=fromJob?state.jobs.find(x=>x.id===fromJob):null;
  const q=j&&j.quoteId?state.quotes.find(x=>x.id===j.quoteId):null;
  const selClient=j?j.clientId:(preClient||state.clients[0].id);
  draftItems = q?q.items.map(i=>({...i})):[{d:'',q:1,p:0}];
  openModal(`<div class="mhead"><h3>${j?'Invoice from job':'New invoice'}</h3><button class="x" onclick="closeModal()">×</button></div>
  <div class="mbody">
    ${q?`<div class="note">Line items pulled from quote <b>${q.id.toUpperCase()}</b>. Edit before sending.</div>`:''}
    <div class="row2">
      <label class="fld"><span>Client</span><select id="q_client" ${j?'disabled':''}>${state.clients.map(c=>`<option value="${c.id}" ${c.id===selClient?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
      <label class="fld"><span>Due date</span><input id="i_due" type="date" value="${daysFromNow(14)}"></label>
    </div>
    <label class="fld"><span>Invoice title</span><input id="q_title" value="${j?esc(j.title):''}" placeholder="What's this invoice for?"></label>
    <span style="display:block;font-size:12.5px;font-weight:600;color:var(--slate);margin:6px 0 8px">Line items</span>
    <div id="q_items"></div>
    <button class="btn ghost sm" onclick="addItem()">＋ Add line item</button>
    <div style="max-width:240px;margin-left:auto;margin-top:8px"><div class="subtot big"><span>Total</span><span id="q_total">$0.00</span></div></div>
  </div>
  <div class="mfoot"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn sec" onclick="saveInvoice('draft','${fromJob||''}')">Save draft</button><button class="btn" onclick="saveInvoice('sent','${fromJob||''}')">Save &amp; send</button></div>`,true);
  renderItems();
}
function saveInvoice(status,fromJob){const title=document.getElementById('q_title').value.trim();if(!title){toast('Add a title');return;}
  const items=draftItems.filter(i=>i.d.trim()).map(i=>({d:i.d,q:+i.q||0,p:+i.p||0}));if(!items.length){toast('Add a line item');return;}
  const inv={id:uid('i'),clientId:document.getElementById('q_client').value,jobId:fromJob||null,title,status,date:today,due:document.getElementById('i_due').value||daysFromNow(14),items};
  state.invoices.push(inv);closeModal();toast(status==='sent'?('Invoice sent'+(state.integrations.qbo?' · synced to QBO':'')):'Draft saved');go('invoices');invoiceDetail(inv.id);}

function recordPayment(invId){const inv=state.invoices.find(i=>i.id===invId);const bal=invBalance(inv);
  openModal(`<div class="mhead"><h3>Record payment</h3><button class="x" onclick="closeModal()">×</button></div>
  <div class="mbody">
    <div class="note">${esc(inv.title)} — balance due <b>${money(bal)}</b></div>
    <div class="row2">
      <label class="fld"><span>Amount</span><input id="pay_amt" type="number" step="any" value="${bal.toFixed(2)}"></label>
      <label class="fld"><span>Date</span><input id="pay_date" type="date" value="${today}"></label>
    </div>
    <label class="fld"><span>Method</span><select id="pay_method"><option>Credit card (2.9% + 30¢)</option><option>ACH bank transfer (1%)</option><option>Tap to Pay</option><option>Cash</option><option>Check</option></select></label>
  </div>
  <div class="mfoot"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="savePayment('${invId}')">Record ${money(bal)}</button></div>`);
}
function savePayment(invId){const amt=+document.getElementById('pay_amt').value||0;if(amt<=0){toast('Enter an amount');return;}
  const inv=state.invoices.find(i=>i.id===invId);
  state.payments.push({id:uid('p'),invoiceId:invId,amount:amt,method:document.getElementById('pay_method').value,date:document.getElementById('pay_date').value||today});
  if(invBalance(inv)<=0)inv.status='paid';
  closeModal();toast('Payment recorded 🎉'+(state.integrations.qbo?' · synced to QBO':''));invoiceDetail(invId);}

function delItem(coll,id){if(!confirm('Delete this? (demo only)'))return;state[coll]=state[coll].filter(x=>x.id!==id);toast('Deleted');go(coll==='quotes'?'quotes':coll==='jobs'?'schedule':'invoices');}

/* clients view needs a nav entry? Clients accessible from requests/quotes; add to Sales group dynamically */
NAVDEF[1][1].splice(1,0,['clients','◍','Clients']);

/* ============================ WORKSPACES & PERSISTENCE ============================ */
const WS_LIST_KEY = 'arkhub-workspaces';
const WS_ACTIVE_KEY = 'arkhub-active';
let activeWs = null;
let SKIP_SAVE = false;
const TRADES = ['Painting & finishing','Drywall','Landscaping','Cleaning','HVAC','Plumbing','Electrical','General contracting','Handyman','Other'];

function getWorkspaces(){ try{ return JSON.parse(localStorage.getItem(WS_LIST_KEY))||[] }catch(e){ return [] } }
function saveWorkspaces(w){ try{ localStorage.setItem(WS_LIST_KEY, JSON.stringify(w)); }catch(e){} }
function wsDataKey(k){ return 'arkhub-ws-'+k; }

function persist(){
  if (SKIP_SAVE || !activeWs || !state) return;
  try { localStorage.setItem(wsDataKey(activeWs.key), JSON.stringify({UID, state})); } catch(e) {}
}

function openWorkspace(key){
  const ws = getWorkspaces().find(w=>w.key===key); if(!ws) return;
  activeWs = ws; SKIP_SAVE = false;
  try{ localStorage.setItem(WS_ACTIVE_KEY, key); }catch(e){}
  let loaded=null;
  try{ const raw=localStorage.getItem(wsDataKey(key)); if(raw) loaded=JSON.parse(raw); }catch(e){}
  if (loaded && loaded.state){ state = Object.assign(baseState(), loaded.state); UID = loaded.UID || UID; }
  else state = ws.seed==='sample' ? seedState() : baseState();
  document.getElementById('bizDot').textContent = (ws.name.trim()[0]||'A').toUpperCase();
  document.getElementById('bizName').textContent = ws.name;
  document.getElementById('bizTrade').textContent = ws.trade || 'Field Service';
  hideLauncher();
  go('dashboard');
  persist();
}

function showLauncher(){
  persist();
  const list=getWorkspaces();
  const l=document.getElementById('launcher');
  l.innerHTML=`<div class="launch">
    <div class="lhead"><h1>TradeLine</h1><p>From first call to final invoice. Run multiple businesses side by side — each keeps its own clients, jobs, money, plan and integrations, saved in this browser.</p><p style="margin-top:10px"><a href="index.html" style="color:#7db4e0;text-decoration:none;font-weight:600">← Back to TradeLine home</a></p></div>
    ${list.length?`<div class="bizgrid">${list.map(w=>`
      <div class="bizcard">
        <div style="display:flex;align-items:center;gap:11px"><span class="bdot">${esc((w.name.trim()[0]||'A').toUpperCase())}</span><div><h3>${esc(w.name)}</h3><span class="tiny">${w.trade||''} · ${w.seed==='sample'?'sample data':'started blank'}</span></div></div>
        <div class="actions"><button class="btn sm" onclick="openWorkspace('${w.key}')">Open →</button><button class="btn danger sm" onclick="deleteWorkspace('${w.key}')">Delete</button></div>
      </div>`).join('')}</div>`:''}
    <div class="launchform">
      <h3>＋ ${list.length?'Add another business':'Create your first business'}</h3>
      <div class="row2">
        <label class="fld"><span>Business name</span><input id="ws_name" placeholder="e.g. Summit Painting Co."></label>
        <label class="fld"><span>Trade</span><select id="ws_trade">${TRADES.map(t=>`<option>${t}</option>`).join('')}</select></label>
      </div>
      <span style="display:block;font-size:12.5px;font-weight:600;color:var(--slate);margin-bottom:6px">Starting data</span>
      <div class="seedopt" id="seedopt">
        <label class="sel" data-seed="blank" onclick="pickSeed(this)"><b>Blank slate</b>Empty — build everything yourself from your first client.</label>
        <label data-seed="sample" onclick="pickSeed(this)"><b>Sample data</b>Pre-loaded finishing-company demo (clients, quotes, jobs, money).</label>
      </div>
      <button class="btn" onclick="createWorkspace()">Create business</button>
    </div>
  </div>`;
  l.style.display='flex';
}
function pickSeed(elm){ document.querySelectorAll('#seedopt label').forEach(x=>x.classList.remove('sel')); elm.classList.add('sel'); }
function hideLauncher(){ document.getElementById('launcher').style.display='none'; }
function createWorkspace(){
  const name=document.getElementById('ws_name').value.trim(); if(!name){ toast('Give the business a name'); return; }
  const seed=document.querySelector('#seedopt label.sel').dataset.seed;
  const ws={ key:'w'+Date.now().toString(36)+Math.floor(Math.random()*1e4), name, trade:document.getElementById('ws_trade').value, seed, created:today };
  const list=getWorkspaces(); list.push(ws); saveWorkspaces(list);
  openWorkspace(ws.key);
  toast('Welcome to '+name+' 🎉');
}
function deleteWorkspace(key){
  if(!confirm('Delete this business and all its data? This can\'t be undone.')) return;
  saveWorkspaces(getWorkspaces().filter(w=>w.key!==key));
  try{ localStorage.removeItem(wsDataKey(key)); }catch(e){}
  if(activeWs && activeWs.key===key){ activeWs=null; try{ localStorage.removeItem(WS_ACTIVE_KEY); }catch(e){} }
  showLauncher();
}
function resetDemo(){
  if(!activeWs) return;
  if(!confirm('Reset "'+activeWs.name+'" back to its starting data?')) return;
  SKIP_SAVE = true;
  try { localStorage.removeItem(wsDataKey(activeWs.key)); } catch(e) {}
  location.reload();
}
document.addEventListener('click', () => setTimeout(persist, 400));
window.addEventListener('beforeunload', persist);

/* ============================ BOOT ============================ */
(function boot(){
  const list=getWorkspaces();
  let key=null; try{ key=localStorage.getItem(WS_ACTIVE_KEY); }catch(e){}
  const ws=list.find(w=>w.key===key);
  if(ws) openWorkspace(ws.key); else showLauncher();
})();
</script>
